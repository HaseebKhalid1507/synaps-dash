<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>synaps·dash</title>
  <link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="rail">
      <div class="brand"><div class="mark">S</div><span>synaps<span class="dim">·dash</span></span></div>
      <div class="rail-actions">
        <button id="new-session" class="btn-new" title="Start a new session in this daemon">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New session</span>
        </button>
      </div>
      <div class="rail-label">Sessions</div>
      <ul id="sessions"></ul>
      <div class="rail-foot">
        <div id="daemon-info">connecting…</div>
        <div class="swatches" id="swatches" title="Palette"></div>
      </div>
    </aside>

    <main id="main">
      <header id="top">
        <button id="rail-toggle" class="icon-btn" title="Toggle sessions">
          <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
        </button>
        <div class="title-wrap">
          <div id="sess-title">synaps·dash</div>
          <span id="model-chip" class="chip hidden"></span>
        </div>
        <div id="presence"></div>
        <div id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></div>
      </header>

      <div id="scroller"><div id="thread"></div></div>

      <button id="jump"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>New messages</button>

      <div id="dock">
        <div id="composer">
          <div id="watchbar" class="watchbar hidden">
            <svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span id="watch-text" class="grow">Watching</span>
            <button id="takeover" class="btn-ghost">Take over</button>
          </div>
          <div class="row">
            <textarea id="input" rows="1" placeholder="Message synaps…" autocomplete="off"></textarea>
            <button id="send" title="Send (Enter)">
              <svg class="i ico-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
              <svg class="i ico-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
        </div>
        <div class="statline"><span id="st-model"></span><span id="st-tokens"></span><span id="st-cost"></span></div>
      </div>
    </main>
  </div>

  <div id="modal" class="hidden">
    <div class="sheet">
      <h3><svg class="i" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span id="modal-title"></span></h3>
      <pre id="modal-prompt"></pre>
      <input id="modal-secret" type="password" class="hidden" autocomplete="off" />
      <div class="acts">
        <button id="modal-no" class="btn-ghost">Deny</button>
        <button id="modal-yes" class="btn-primary">Allow</button>
      </div>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="/app.js"></script>
</body>
</html>
